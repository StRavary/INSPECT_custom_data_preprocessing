n_gpus: 1
get_features: true
stage: classify
output_dir: /data/processed/INSPECT/CNN_embeddings/wandb # use for wandb logging
test_split: test  # all
ckpt: null

lr: 0.0005
# LR multiplier applied to backbone params when using discriminative LRs
# (see trainer.freeze_backbone_epochs below). 1.0 = single LR for every
# param, identical to prior behavior. Only takes effect for models that
# expose separate `.model` (backbone) / `.classifier` (head) submodules,
# e.g. Model2D.
backbone_lr_mult: 1.0
optimizer:
  name: AdamW
loss:
  loss_fn: BCEWithLogitsLoss

monitor:
  metric: val/mean_auroc
  mode: max

exp:
  base_dir: /data/processed/INSPECT/checkpoints # use for ckpt saving
  name: 'classify'

trainer:
  weights_summary: top
  seed: 6
  val_check_interval: 1.0
  limit_val_batches: 1.0
  precision: "bf16-mixed"  # use BF16 mixed precision for high speed and FP32-grade dynamic range (prevents NaN)
  max_epochs: 30
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  num_workers: 16
  strategy: ddp
  position_encoding: true
  # Number of epochs to train with the backbone frozen (requires_grad=False,
  # head-only training) before unfreezing it for full fine-tuning. 0 = no
  # freezing, identical to prior behavior. Only takes effect for models
  # exposing freeze_backbone()/unfreeze_backbone(), e.g. Model2D.
  freeze_backbone_epochs: 0

defaults:
  - _self_
  - dataset: stanford_featurized
  - model: model_1d
