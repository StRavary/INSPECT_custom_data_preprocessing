n_gpus: 1
get_features: true
stage: classify
output_dir: /data/processed/INSPECT/CNN_embeddings/wandb # use for wandb logging
test_split: test  # all
ckpt: "/data/processed/INSPECT/2026-07-24 - RSNA_chkpt/11-23-09/outputs/classify_pe_present_on_image_2026-07-24_15:23:11/epoch=27-val/mean_auroc=0.998.ckpt"

lr: 0.0005
optimizer:
  name: AdamW
loss:
  loss_fn: BCEWithLogitsLoss

monitor:
  metric: val/mean_auroc
  mode: max

exp:
  base_dir: /data/processed/INSPECT/CNN_embeddings # use for ckpt saving
  name: 'classify'

trainer:
  weights_summary: top
  seed: 6
  val_check_interval: 1.0
  limit_val_batches: 1.0
  precision: "bf16-mixed"  # use BF16 mixed precision for high speed and FP32-grade dynamic range (prevents NaN)
  max_epochs: 30
  gradient_clip_val: 1.0
  accumulate_grad_batches: 64
  num_workers: 16
  strategy: ddp
  position_encoding: true

defaults:
  - _self_
  - dataset: stanford_featurized
  - model: model_1d
